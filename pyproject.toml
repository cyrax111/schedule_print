[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule-print"
version = "0.1.0"
description = "Scheduled, bed-confirmed printing for a Snapmaker U1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1",
    "websockets>=14",
    "itsdangerous>=2.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["migrations/*.sql", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
# Only our tests: scripts/sim-up.sh clones third-party repos (with their own tests) into vendor/.
testpaths = ["tests"]
markers = ["integration: needs the u1sim simulator (see tests/integration/README.md)"]
addopts = "-m 'not integration'"
# Raised by Starlette's test client, not by app code.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning"]
